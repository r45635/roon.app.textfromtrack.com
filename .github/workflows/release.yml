# ──────────────────────────────────────────────────────────────────────────────
# TextFromTrack Companion — Release workflow
#
# Triggers:
#   • Push of a version tag (v0.9.0, v1.0.0, …)  →  publishes a real release
#   • Manual dispatch                              →  creates a draft release
#
# Steps per platform:
#   1. Build the React client  (client/dist/)
#   2. Run electron-builder    (dist/*.dmg / *.exe / *.AppImage / *.deb)
#   3. Upload platform artifact
#
# Final job downloads all artifacts and creates a single GitHub Release.
# ──────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'   # pre-release tags: v1.0.0-beta.1
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (e.g. v0.9.0)'
        required: true
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  packages: write   # required for ghcr.io push

# ── macOS ──────────────────────────────────────────────────────────────────────
jobs:
  build-mac:
    name: Build — macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build React app
        working-directory: client
        run: npm run build

      - name: Build Electron — macOS
        run: npx electron-builder --mac --publish never
        env:
          # Skip codesigning on CI unless certificates are configured.
          # Set CSC_LINK + CSC_KEY_PASSWORD secrets to enable notarization.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 3

# ── Windows ────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build — Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build React app
        working-directory: client
        run: npm run build

      - name: Build Electron — Windows
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 3

# ── Linux ──────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build — Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build React app
        working-directory: client
        run: npm run build

      - name: Build Electron — Linux
        run: npx electron-builder --linux --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 3

# ── Docker ──────────────────────────────────────────────────────────────────────────────
  build-docker:
    name: Build — Docker image
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          TAGS="ghcr.io/r45635/roon-companion:latest
          ghcr.io/r45635/roon-companion:${{ steps.version.outputs.version }}"
          if [ -n "${DOCKERHUB_USER}" ]; then
            TAGS="${TAGS}
          ${DOCKERHUB_USER}/roon-companion:latest
          ${DOCKERHUB_USER}/roon-companion:${{ steps.version.outputs.version }}"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ── Publish GitHub Release ─────────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-mac, build-windows, build-linux, build-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: List release assets
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: >-
            TextFromTrack Companion
            ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          tag_name: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: >-
            ${{ github.event_name == 'workflow_dispatch' && (inputs.draft == true || inputs.draft == 'true') }}
          prerelease: >-
            ${{ contains(github.ref_name, '-') || contains(inputs.tag, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            ## Installation

            | Platform | File | Notes |
            |---|---|---|
            | macOS | `.dmg` | Drag to Applications. Requires macOS 11+. |
            | Windows | `Setup.exe` | Run the NSIS installer. Requires Windows 10+. |
            | Linux | `.AppImage` | `chmod +x *.AppImage && ./TextFromTrack*.AppImage` |
            | Linux (Debian/Ubuntu) | `.deb` | `sudo dpkg -i *.deb` |
            | Docker (all platforms) | — | `docker compose up -d` — see below |

            ### Docker (headless / server)

            ```bash
            # Download docker-compose.yml
            curl -O https://raw.githubusercontent.com/r45635/roon.app.textfromtrack.com/main/docker-compose.yml
            # Edit TFT_TOKEN and the music volume path, then:
            docker compose up -d
            ```
            Images: `ghcr.io/r45635/roon-companion` · `r45635/roon-companion`

            > Full install guide: https://r45635.github.io/roon.app.textfromtrack.com/docs/install.html
            >
            > **First launch:** The app starts silently in your tray / menu bar.
            > Open the UI → authorize with Roon → you're ready.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
