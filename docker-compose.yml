# ─────────────────────────────────────────────────────────────────────────────
# TextFromTrack Roon Companion — Docker Compose
#
# Quick start (Linux / NAS / Raspberry Pi):
#   1. docker compose up -d
#   2. Open http://localhost:3888 and enable the extension in Roon → Settings → Extensions
#   That's enough for live synced lyrics of whatever Roon plays (lyrics-only mode).
#   To save lyrics into your files, also mount your music folder (below).
#   AI lyrics with TextFromTrack (TFT_TOKEN) are coming soon — the service is still in development.
#
# Image: ghcr.io/r45635/roon-companion  (also on Docker Hub: r45635/roon-companion)
# GitHub: https://github.com/r45635/roon.app.textfromtrack.com
# ─────────────────────────────────────────────────────────────────────────────

services:
  roon-companion:
    image: ghcr.io/r45635/roon-companion:latest
    container_name: roon-companion

    # ── Networking ─────────────────────────────────────────────────────────────
    # network_mode: host is required on Linux for Roon's Sood UDP auto-discovery.
    # The Roon Core will detect the extension automatically on the local network.
    #
    # macOS / Windows (Docker Desktop): host mode is NOT supported.
    # Remove or comment out network_mode and uncomment the ports block below,
    # then set ROON_CORE_HOST to the IP address of your Roon Core machine.
    network_mode: host   # Linux only

    # Uncomment for macOS / Windows Docker Desktop (and set ROON_CORE_HOST below):
    # ports:
    #   - "3888:3888"

    volumes:
      # Persistent storage: settings, job history, lrc-cache
      # A ./data/ directory will be created automatically on first run.
      - ./data:/app/src/storage

      # Optional: your music library. Change the LEFT side to the path on your host.
      # Without it the app runs in lyrics-only mode (no file access needed).
      # Keep ":rw" to let the app write .lrc files and embed lyrics; ":ro" only
      # reads existing lyrics and tags (saving then fails).
      # - /path/to/your/music:/music:rw

    environment:
      # ── Optional ─────────────────────────────────────────────────────────────

      # TextFromTrack Personal Access Token, for AI lyrics — coming soon (service in development).
      # Once accounts open, create one at https://app.textfromtrack.com/account/tokens (or paste it in the app).
      TFT_TOKEN: ""

      # Path(s) to your music inside the container — must match the volume above.
      # Uncomment together with the music volume.
      # MUSIC_ROOTS: /music

      PORT: 3888

      # Direct Roon Core IP address.
      # Required on macOS / Windows where network_mode: host is not supported.
      # Roon auto-discovery (Sood UDP) does not work through Docker's NAT —
      # setting this bypasses discovery and connects directly via WebSocket.
      # Example: ROON_CORE_HOST: 192.168.1.10
      ROON_CORE_HOST: ""
      # Roon Core extension port (Roon 2.x: 9330; legacy 1.x cores: 9100).
      # ROON_CORE_PORT: 9330

      # Require a token from other devices (open http://<host>:3888/?access_token=<token> once
      # on each phone/tablet; it is remembered).
      # ACCESS_TOKEN: change-me

      # Behind a reverse proxy with your own domain, allow that host name
      # (LAN names and IP addresses are always allowed).
      # ALLOWED_HOSTS: lyrics.example.com

    restart: unless-stopped
