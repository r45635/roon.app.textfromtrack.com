appId: com.textfromtrack.roon-companion
productName: TextFromTrack Companion
copyright: Copyright © 2026 TextFromTrack

# Disable asar so the Express server can be spawned as a plain Node.js child
# process (ELECTRON_RUN_AS_NODE=1). Asar archives are Electron's virtual FS —
# a separately spawned Node.js process cannot read from them.
asar: false

# ── Source files to bundle ───────────────────────────────────────────────────
files:
  - "electron/**"
  - "src/**"
  - "client/dist/**"
  - "docs/**"
  - "package.json"
  # Exclude runtime-mutable data files from the bundle — they live in userData.
  # Keep src/storage/userSettings.js (it's a required JS module, not data).
  - "!src/storage/*.json"
  - "!src/storage/lrc-cache/**"
  # Exclude dev/test artefacts
  - "!tests/**"
  - "!scripts/**"
  - "!dev-tools/**"
  - "!screenshoots/**"
  - "!**/*.test.js"
  - "!**/.env*"

directories:
  buildResources: electron/assets
  output: dist

# ── macOS ────────────────────────────────────────────────────────────────────
mac:
  target:
    - dmg
    - zip
  icon: electron/assets/icon.png
  # macOS 15+ Local Network privacy: without a usage description the system
  # cannot prompt and silently blocks LAN connections (Roon Core, other backends).
  extendInfo:
    NSLocalNetworkUsageDescription: "TextFromTrack Companion connects to your Roon Core and to other TextFromTrack backends on your local network."
    NSBonjourServices:
      - _textfromtrack._tcp
  # Ad-hoc sign the whole bundle until a Developer ID exists. Unsigned builds
  # keep Electron's stock linker signature, whose cdhash is shared by every
  # app on that Electron version — Apple revoked Electron 31.7.7's (malware
  # reuse), so our app was blocked as "Malware". Ad-hoc gives our own cdhash.
  # Hardened runtime needs disable-library-validation with ad-hoc; off for now.
  identity: "-"
  hardenedRuntime: false
  # Replace with a Developer ID (and notarize) when available:
  # identity: "Developer ID Application: Your Name (XXXXXXXXXX)"
  # hardenedRuntime: true
  # gatekeeperAssess: false
  # entitlements: electron/entitlements.plist
  # entitlementsInherit: electron/entitlements.plist
  # notarize: true

dmg:
  title: TextFromTrack Companion
  icon: electron/assets/icon.png
  # Disable background image so the APFS DMG build works on arm64 CI runners.
  background: null

# ── Windows ──────────────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch: [x64, ia32]
    - target: portable
      arch: [x64]
  icon: electron/assets/icon.png
  # Uncomment when you have a code-signing certificate:
  # certificateSubjectName: "Your Company Name"
  # certificateSha1: "..."

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: TextFromTrack Companion

# ── Linux ────────────────────────────────────────────────────────────────────
linux:
  target:
    - AppImage
    - deb
  icon: electron/assets/icon.png
  category: AudioVideo
  desktop:
    entry:
      StartupNotify: "false"

# ── Auto-update: publish to GitHub Releases ──────────────────────────────────
publish:
  provider: github
  owner: r45635
  repo: roon.app.textfromtrack.com
  releaseType: release
